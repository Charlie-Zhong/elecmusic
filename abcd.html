<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Dream Synth · 梦幻多音合成器</title>
    <style>
        * { box-sizing: border-box; }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background:
                radial-gradient(circle at 50% 0%, rgba(108,99,255,.16), transparent 38%),
                radial-gradient(circle at 15% 80%, rgba(0,210,255,.07), transparent 30%),
                #080914;
            color: #eee;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 28px 20px 40px;
            margin: 0;
            overflow-x: hidden;
        }

        .app-title {
            margin: 0 0 6px;
            font-size: clamp(24px, 4vw, 36px);
            letter-spacing: .04em;
            background: linear-gradient(90deg, #fff, #a8a3ff, #73e7ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .subtitle {
            margin: 0 0 22px;
            color: #8589a8;
            font-size: 13px;
        }

        .top-controls {
            width: min(1120px, 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 14px 24px;
            margin-bottom: 22px;
            background: rgba(20,21,42,.82);
            backdrop-filter: blur(16px);
            padding: 14px 18px;
            border-radius: 18px;
            box-shadow: 0 18px 50px rgba(0,0,0,.45);
            border: 1px solid rgba(255,255,255,.09);
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .control-label {
            color: #9da2c2;
            font-size: 13px;
            font-weight: 700;
        }

        input[type="range"] {
            width: 130px;
            accent-color: #7c73ff;
            cursor: pointer;
        }

        .value {
            min-width: 46px;
            text-align: right;
            color: #c9c6ff;
            font-variant-numeric: tabular-nums;
            font-size: 13px;
        }

        #panic-btn {
            padding: 9px 15px;
            background: #25263d;
            color: #d9dbed;
            border: 1px solid #454765;
            border-radius: 9px;
            cursor: pointer;
            font-weight: 700;
        }
        #panic-btn:hover { background: #30324e; }

        #start-btn {
            padding: 10px 24px;
            font-size: 16px;
            background-color: #6C63FF;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(108, 99, 255, 0.4);
            transition: all 0.3s ease;
        }
        #start-btn:hover { transform: scale(1.05); }
        #start-btn:disabled { 
            background-color: #222; 
            color: #555; 
            cursor: not-allowed; 
            box-shadow: none; 
            transform: none;
        }

        .transpose-group {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 15px;
            font-weight: bold;
            color: #a0a0b5;
        }

        select {
            padding: 8px 12px;
            font-size: 16px;
            background-color: #111;
            color: #6C63FF;
            border: 1px solid #444;
            border-radius: 6px;
            cursor: pointer;
            outline: none;
            font-weight: bold;
            text-align: center;
        }
        select:focus { border-color: #6C63FF; }
        
        .hint-text {
            font-size: 13px;
            color: #888;
            margin-left: 10px;
            background: #111;
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid #333;
        }

        .keyboard-wrapper {
            width: 100%;
            max-width: 1400px;
            overflow-x: hidden;
            padding: 14px 0 24px;
            display: flex;
            justify-content: center;
        }
        .keyboard-wrapper::-webkit-scrollbar { height: 8px; }
        .keyboard-wrapper::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }

        .keyboard {
            display: flex;
            position: relative;
            user-select: none;
            touch-action: none;
            background: linear-gradient(180deg, #17182a, #0d0e1a);
            padding: 14px;
            border-radius: 18px;
            box-shadow: 0 24px 70px rgba(0,0,0,.72), inset 0 1px 0 rgba(255,255,255,.08);
            border: 1px solid rgba(255,255,255,.08);
        }

        .keyboard {
            transform-origin: top center;
        }

        @media (max-width: 900px) {
            .keyboard {
                transform: scale(calc(100vw / 1200));
                margin-bottom: calc(-240px * (1 - (100vw / 1200)));
            }
        }

        .key {
            box-sizing: border-box;
            cursor: pointer;
            border-radius: 0 0 6px 6px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            transition: background-color 0.1s;
        }

        .key.white {
            width: 48px;
            height: 240px;
            background: linear-gradient(180deg, #f7f7fb, #d8d9e5);
            border: 1px solid #b8bac9;
            margin: 0 1px;
            z-index: 1;
            box-shadow: 0 5px 10px rgba(0,0,0,.28);
        }
        .key.white:active, .key.white.active {
            background: linear-gradient(180deg, #aaa9c8, #c9c9db);
            box-shadow: inset 0 2px 5px rgba(0,0,0,.25);
            transform: translateY(2px);
        }

        .key.black {
            width: 30px;
            height: 150px;
            background: linear-gradient(180deg, #303147, #080912 78%);
            position: absolute;
            z-index: 2;
            border: 1px solid #05050a;
            box-shadow: 2px 5px 9px rgba(0,0,0,.72);
        }
        .key.black:active, .key.black.active {
            background: linear-gradient(180deg, #6862b8, #282653);
            box-shadow: inset 0 2px 5px rgba(0,0,0,.8);
        }

        .status {
            margin-top: 0;
            color: #777c9e;
            font-size: 12px;
            text-align: center;
        }
    
        /* ===== 右上角仿钢琴谱和弦显示 ===== */
        #staff-container {
            position:relative;
            order:3;
            width:360px;
            margin-top:24px;
            background:#fff;
            border-radius:8px;
            overflow:hidden;
            box-shadow:0 8px 25px rgba(0,0,0,.35);
        }

        #staff-svg { width:100%; display:block; }
        .staff-line,.ledger-line { stroke:#111; stroke-width:2.8; }
        .staff-clef { font-family:serif; fill:#111; }
        .staff-note {
            fill:#fff;
            stroke:#111;
            stroke-width:2.8;
        }
        .staff-accidental {
            font-family:serif;
            font-size:24px;
            font-weight:700;
            fill:#111;
        }

    </style>
</head>
<body>
    <h1 class="app-title">Dream Synth</h1>
    <p class="subtitle">Ambient Pad · Polyphonic Web Audio Synthesizer</p>

    <div class="top-controls">
        <button id="start-btn">点击激活引擎</button>
        <div class="transpose-group">
            <label for="transpose">全局移调</label>
            <select id="transpose"></select>
            <div class="hint-text">
                <b>↑ ↓</b> 半音 &nbsp;|&nbsp; <b>← →</b> 八度
            </div>
        </div>

        <div class="control-group">
            <span class="control-label">音量</span>
            <input id="volume" type="range" min="0" max="1" step="0.01" value="0.72">
            <span class="value" id="volume-value">72%</span>
        </div>

        <div class="control-group">
            <span class="control-label">混响</span>
            <input id="reverb" type="range" min="0" max="0.8" step="0.01" value="0.18">
            <span class="value" id="reverb-value">18%</span>
        </div>

        <button id="panic-btn" title="立即停止所有声音">■ 停止全部</button>
    </div><div class="keyboard-wrapper">
        <div class="keyboard" id="keyboard-container"></div>
    </div>
    <div class="status">按键支持：Z-M / Q-P / 数字键等 </div>
<div id="staff-container">
        <svg id="staff-svg" viewBox="0 0 300 260" aria-label="实时钢琴和弦五线谱">
            <g id="notes-layer"></g>
            <g id="staff-lines"></g>
            <g id="ledger-layer"></g>
            <text id="treble-clef" class="staff-clef" x="45" y="90" font-size="60">𝄞</text>
            <text id="bass-clef" class="staff-clef" x="45" y="200" font-size="55">𝄢</text>
        </svg>
    </div>

<script>
    // 1. 全局状态
    let transposeOffset = 0; 
    let audioCtx = null;
    const activeNotes = new Map();
    let masterBus = null;
    let compressor = null;
    let masterGain = null;
    let dryGain = null;
    let wetGain = null;
    let convolver = null;
    let reverbBuffer = null;
    let volumeLevel = 0.72;
    let reverbLevel = 0.18; 

    // --- 动态生成移调下拉菜单 (扩展为上下各 3 个八度: -36 到 +36) ---
    const transposeSelect = document.getElementById('transpose');
    for(let i = -36; i <= 36; i++) {
        let opt = document.createElement('option');
        opt.value = i;
        let sign = i > 0 ? '+' : '';
        
        // 格式化显示：如果是 12 的倍数，标注八度
        if (i === 0) {
            opt.innerText = 'C (原调 0)';
        } else if (i % 12 === 0) {
            opt.innerText = `${sign}${i / 12} 八度 (${sign}${i})`;
        } else {
            opt.innerText = `${sign}${i} 半音`;
        }
        
        if(i === 0) opt.selected = true;
        transposeSelect.appendChild(opt);
    }

    transposeSelect.addEventListener('change', (e) => {
        transposeOffset = parseInt(e.target.value, 10);
    });

    // 快捷转调/八度切换函数
    function changeTranspose(delta) {
        let newVal = transposeOffset + delta;
        // 限制在 ±36 个半音以内
        if (newVal >= -36 && newVal <= 36) {
            transposeOffset = newVal;
            transposeSelect.value = transposeOffset; // 实时同步下拉框 UI
        }
    }

    // 2. 物理建模参数: 梦幻氛围音色 (Ambient Pad)
    const DREAM_TIMBRE = {
        1.000: 0.30,   
        2.000: 0.45, 
        3.000: 0.15,
        4.000: 0.05
    };

    const SYNTH_PARAMS = {
        attack: 0.025,
        decay: 0.35,
        sustain: 0.68,
        release: 0.75,
        // 单音最大电平；和弦时交给 compressor 做最后保护
        voiceGain: 0.22
    };

    // 3. 动态生成键盘 (MIDI 48 到 100)
    const START_MIDI = 48; 
    const END_MIDI = 100;   
    const NOTE_NAMES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
    const WHITE_KEY_WIDTH = 50;
    
    // 缝合版映射字典
    const CODE_TO_MIDI = {
        'KeyZ': 48, 'KeyS': 49, 'KeyX': 50, 'KeyD': 51, 'KeyC': 52, 
        'KeyV': 53, 'KeyG': 54, 'KeyB': 55, 'KeyH': 56, 'KeyN': 57, 'KeyJ': 58, 'KeyM': 59,
        'Comma': 60, 'KeyL': 61, 'Period': 62, 'Semicolon': 63, 'Slash': 64,
        'KeyQ': 60, 'Digit2': 61, 'KeyW': 62, 'Digit3': 63, 'KeyE': 64, 
        'KeyR': 65, 'Digit5': 66, 'KeyT': 67, 'Digit6': 68, 'KeyY': 69, 'Digit7': 70, 'KeyU': 71,
        'KeyI': 72, 'Digit9': 73, 'KeyO': 74, 'Digit0': 75, 'KeyP': 76, 
        'BracketLeft': 77, 'Equal': 78, 'BracketRight': 79, 
        'Backspace': 80, 'Backslash': 81, 'Insert': 82, 'Delete': 83, 'End': 84,         
        'Numpad1': 84, 'Numpad2': 86, 'Numpad3': 88, 
        'Numpad4': 89, 'Numpad5': 91, 'Numpad6': 93, 
        'Numpad7': 95, 'Numpad8': 96, 'Numpad9': 98, 
        'Numpad0': 85, 'NumpadDecimal': 87, 
        'NumpadDivide': 90, 'NumpadMultiply': 92, 'NumpadSubtract': 94,
        'NumpadAdd': 97, 'NumpadEnter': 99
    };

    const kbContainer = document.getElementById('keyboard-container');

    // ===== 仿钢琴谱实时和弦五线谱 =====
    const notesLayer = document.getElementById('notes-layer');
    const ledgerLayer = document.getElementById('ledger-layer');
    const staffLines = document.getElementById('staff-lines');

    function line(y){
        const l=document.createElementNS('http://www.w3.org/2000/svg','line');
        l.setAttribute('x1',55); l.setAttribute('x2',285);
        l.setAttribute('y1',y); l.setAttribute('y2',y);
        l.setAttribute('class','staff-line');
        staffLines.appendChild(l);
    }

    function buildStaff(){
        staffLines.innerHTML='';
        // 高音五线：E4 G4 B4 D5 F5
        [50,60,70,80,90].forEach(line);
        // 低音五线：G2 B2 D3 F3 A3
        [165,175,185,195,205].forEach(line);
    }

    const pitchSteps={C:0,D:1,E:2,F:3,G:4,A:5,B:6};
    function midiInfo(midi){
        const pc=NOTE_NAMES[midi%12];
        return {name:pc[0], accidental:pc.length>1?pc[1]:'', octave:Math.floor(midi/12)-1};
    }
    function staffDegree(midi){
        const n=midiInfo(midi);
        return (n.octave-4)*7+pitchSteps[n.name];
    }

    // 返回真正钢琴谱位置：C4 = 高音下加一线 / 低音上加一线
    function notePosition(midi){
        const d=staffDegree(midi);
        if(d>=0){
            // C4=100, E4第一线=90
            return {y:100-d*5, clef:'treble'};
        }
        // C4以下：低音谱号，C4=155上加一线
        return {y:155-d*5, clef:'bass'};
    }

    function addLedger(x,y){
        const l=document.createElementNS('http://www.w3.org/2000/svg','line');
        l.setAttribute('x1',x-16); l.setAttribute('x2',x+16);
        l.setAttribute('y1',y); l.setAttribute('y2',y);
        l.setAttribute('class','ledger-line');
        ledgerLayer.appendChild(l);
    }

    function updateStaff(){
        notesLayer.innerHTML='';
        if(ledgerLayer) ledgerLayer.innerHTML='';
        const notes=[...activeNotes.keys()].sort((a,b)=>a-b);
        if(!notes.length)return;

        let items=notes.map(m=>({midi:m,...notePosition(m)}));
        items.forEach(i=>{
            i.x=205;
            i.y=i.y;
        });

        // 和弦排版：
        // 二度音程只允许两个横向位置，不产生连续阶梯偏移
        // 模拟传统钢琴谱：左列 + 右列
        // 三度以上保持同列堆叠

        const NOTE_RX = 7;
        const SECOND_OFFSET = Math.ceil(
            Math.sqrt(NOTE_RX * NOTE_RX + 4.8 * 4.8)
        );
        const BASE_X = 205;

        items.forEach(i=>{
            i.x = BASE_X;
            i.degree = staffDegree(i.midi);
        });

        let hasSecondCluster = false;

        for(let i=1;i<items.length;i++){
            const gap = Math.abs(
                items[i].degree - items[i-1].degree
            );

            if(gap===1){
                hasSecondCluster = true;
                break;
            }
        }

        if(hasSecondCluster){
            // 所有二度链统一限制为两列
            // 奇偶音级决定左右列
            const bottomDegree = items[0].degree;

            items.forEach(i=>{
                const parity =
                    Math.abs(i.degree-bottomDegree)%2;

                i.x = parity===0
                    ? BASE_X-SECOND_OFFSET
                    : BASE_X+SECOND_OFFSET;
            });
        }

        items.forEach(i=>{
            let x=i.x;
            let y=i.y;

            // 五线外加线
            if(y<50){ for(let ly=40;ly>=y;ly-=10)addLedger(x,ly); }
            if(y>205){ for(let ly=215;ly<=y;ly+=10)addLedger(x,ly); }
            if(i.midi===60)addLedger(x,100);

            const info=midiInfo(i.midi);
            if(info.accidental){
                const a=document.createElementNS('http://www.w3.org/2000/svg','text');
                a.setAttribute('x',x-34); a.setAttribute('y',y+8);
                a.setAttribute('class','staff-accidental');
                a.textContent='♯';
                notesLayer.appendChild(a);
            }

            // 全音符：椭圆宽度接近谱间距
            const e=document.createElementNS('http://www.w3.org/2000/svg','ellipse');
            e.setAttribute('cx',x); e.setAttribute('cy',y);
            e.setAttribute('rx',7); e.setAttribute('ry',4.8);
            e.setAttribute('transform',`rotate(-18 ${x} ${y})`);
            e.setAttribute('class','staff-note');
            notesLayer.appendChild(e);
        });
    }
    buildStaff();

    // 频率计算 (叠加转调参数)
    function midiToFreq(midi) {
        const transposedMidi = midi + transposeOffset;
        return 440 * Math.pow(2, (transposedMidi - 69) / 12);
    }

    // 4. 构建可视化键盘
    function buildVisualKeyboard() {
        let whiteKeyCount = 0;
        for (let midi = START_MIDI; midi <= END_MIDI; midi++) {
            const isBlack = NOTE_NAMES[midi % 12].includes('#');
            const keyDiv = document.createElement('div');
            keyDiv.className = `key ${isBlack ? 'black' : 'white'}`;
            keyDiv.id = `midi-${midi}`;
            
            if (isBlack) {
                const leftPos = (whiteKeyCount * WHITE_KEY_WIDTH) - 15 + 12; 
                keyDiv.style.left = `${leftPos}px`;
            } else {
                whiteKeyCount++;
            }
            kbContainer.appendChild(keyDiv);

            keyDiv.addEventListener('pointerdown', (e) => {
                e.preventDefault();
                keyDiv.setPointerCapture?.(e.pointerId);
                triggerNoteOn(midi);
            });
            keyDiv.addEventListener('pointerup', () => triggerNoteOff(midi));
            keyDiv.addEventListener('pointercancel', () => triggerNoteOff(midi));
            keyDiv.addEventListener('lostpointercapture', () => triggerNoteOff(midi));
        }
    }
    buildVisualKeyboard();


    // ===== 音频总线：所有声音先进入 compressor，再到输出 =====
    function createImpulseResponse(ctx, duration = 2.2, decay = 2.6) {
        const length = Math.floor(ctx.sampleRate * duration);
        const impulse = ctx.createBuffer(2, length, ctx.sampleRate);
        for (let ch = 0; ch < 2; ch++) {
            const data = impulse.getChannelData(ch);
            for (let i = 0; i < length; i++) {
                const t = i / length;
                data[i] = (Math.random() * 2 - 1) * Math.pow(1 - t, decay);
            }
        }
        return impulse;
    }

    function setupAudioGraph() {
        masterBus = audioCtx.createGain();
        compressor = audioCtx.createDynamicsCompressor();

        // 温和的“胶水压缩”：多个音同时响时自动压低峰值，显著减少刺耳/爆音
        compressor.threshold.value = -18;
        compressor.knee.value = 12;
        compressor.ratio.value = 4;
        compressor.attack.value = 0.008;
        compressor.release.value = 0.18;

        masterGain = audioCtx.createGain();
        masterGain.gain.value = volumeLevel;

        dryGain = audioCtx.createGain();
        wetGain = audioCtx.createGain();
        dryGain.gain.value = 0.9;
        wetGain.gain.value = reverbLevel;

        convolver = audioCtx.createConvolver();
        reverbBuffer = createImpulseResponse(audioCtx);
        convolver.buffer = reverbBuffer;

        masterBus.connect(compressor);
        compressor.connect(masterGain);
        masterGain.connect(dryGain);
        masterGain.connect(convolver);
        convolver.connect(wetGain);

        dryGain.connect(audioCtx.destination);
        wetGain.connect(audioCtx.destination);
    }

    function updateVolume() {
        if (masterGain) {
            masterGain.gain.setTargetAtTime(volumeLevel, audioCtx.currentTime, 0.015);
        }
    }

    function updateReverb() {
        if (wetGain) {
            wetGain.gain.setTargetAtTime(reverbLevel, audioCtx.currentTime, 0.03);
        }
    }

    function stopAllNotes() {
        if (!audioCtx) return;
        for (const midi of [...activeNotes.keys()]) triggerNoteOff(midi);
    }

    const startBtn = document.getElementById('start-btn');
    startBtn.addEventListener('click', async () => {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') await audioCtx.resume();
        if (!masterBus) setupAudioGraph();
        startBtn.innerText = "✨ 梦幻引擎已激活";
        startBtn.disabled = true;
    });

    // 5. 核心发声与终止逻辑
    function triggerNoteOn(midi) {
        if (!audioCtx || !masterBus || activeNotes.has(midi)) return;

        const freq = midiToFreq(midi);
        const now = audioCtx.currentTime;

        const keyEl = document.getElementById(`midi-${midi}`);
        if (keyEl) keyEl.classList.add('active');

        // 每个音符独立衰减，再进入总线压缩器。
        // 这里必须使用 voiceGain；原优化版漏掉了它的声明，
        // 导致按键时 ReferenceError，从而“没有声音”。
        const voiceGain = audioCtx.createGain();
        voiceGain.connect(masterBus);
        voiceGain.gain.setValueAtTime(0.0001, now);
        voiceGain.gain.linearRampToValueAtTime(
            SYNTH_PARAMS.voiceGain,
            now + SYNTH_PARAMS.attack
        );
        voiceGain.gain.setTargetAtTime(
            SYNTH_PARAMS.voiceGain * SYNTH_PARAMS.sustain,
            now + SYNTH_PARAMS.attack,
            SYNTH_PARAMS.decay
        );

        const oscillators = [];

        for (const [ratioStr, baseAmp] of Object.entries(DREAM_TIMBRE)) {
            const ratio = parseFloat(ratioStr);
            const osc = audioCtx.createOscillator();
            const partialGain = audioCtx.createGain();

            osc.type = 'sine';
            osc.frequency.value = freq * ratio;

            partialGain.gain.value = baseAmp * 0.78;

            osc.connect(partialGain);
            partialGain.connect(voiceGain);

            osc.start(now);
            oscillators.push(osc);
        }

        activeNotes.set(midi, { voiceGain, oscillators });
        updateStaff();
    }

    function triggerNoteOff(midi) {
        if (!audioCtx || !activeNotes.has(midi)) return;

        const keyEl = document.getElementById(`midi-${midi}`);
        if (keyEl) keyEl.classList.remove('active');

        const { voiceGain, oscillators } = activeNotes.get(midi);
        const now = audioCtx.currentTime;

        voiceGain.gain.cancelScheduledValues(now);
        voiceGain.gain.setValueAtTime(Math.max(voiceGain.gain.value, 0.0001), now);
        voiceGain.gain.exponentialRampToValueAtTime(0.0001, now + SYNTH_PARAMS.release);

        oscillators.forEach(osc => osc.stop(now + SYNTH_PARAMS.release + 0.1));
        activeNotes.delete(midi);
        updateStaff();
    }


    // ===== 参数控制 =====
    const volumeEl = document.getElementById('volume');
    const volumeValueEl = document.getElementById('volume-value');
    const reverbEl = document.getElementById('reverb');
    const reverbValueEl = document.getElementById('reverb-value');
    const panicBtn = document.getElementById('panic-btn');

    volumeEl.addEventListener('input', (e) => {
        volumeLevel = parseFloat(e.target.value);
        volumeValueEl.textContent = `${Math.round(volumeLevel * 100)}%`;
        updateVolume();
    });

    reverbEl.addEventListener('input', (e) => {
        reverbLevel = parseFloat(e.target.value);
        reverbValueEl.textContent = `${Math.round(reverbLevel * 100)}%`;
        updateReverb();
    });

    panicBtn.addEventListener('click', stopAllNotes);

    // 6. 键盘事件拦截 (完美集成左右八度切换)
    window.addEventListener('keydown', (e) => {
        // 拦截方向键
        if (e.key === 'ArrowUp') {
            e.preventDefault(); 
            changeTranspose(1); // 升半音
            return;
        }
        if (e.key === 'ArrowDown') {
            e.preventDefault();
            changeTranspose(-1); // 降半音
            return;
        }
        if (e.key === 'ArrowLeft') {
            e.preventDefault();
            changeTranspose(-12); // 降一个八度
            return;
        }
        if (e.key === 'ArrowRight') {
            e.preventDefault();
            changeTranspose(12); // 升一个八度
            return;
        }

        if (e.repeat) return; 
        const midiCode = CODE_TO_MIDI[e.code];
        if (midiCode !== undefined) {
            triggerNoteOn(midiCode);
        }
    });

    window.addEventListener('keyup', (e) => {
        const midiCode = CODE_TO_MIDI[e.code];
        if (midiCode !== undefined) {
            triggerNoteOff(midiCode);
        }
    });

    window.addEventListener('blur', stopAllNotes);
    window.addEventListener('pointerup', () => {
        // 在页面外松开也释放音符，避免出现“卡住一直响”
        for (const midi of [...activeNotes.keys()]) triggerNoteOff(midi);
    });

</script>
